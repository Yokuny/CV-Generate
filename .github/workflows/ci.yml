name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      # A prévia do envio (testes do CLI) imprime o PDF com o Chromium do Playwright.
      - run: pnpm --filter @cv-studio/api exec playwright install --with-deps chromium
      - run: pnpm test
      # Gateway de documentação (AGENTS.md): docs/index.* em dia com os
      # feature.md e frontmatter válido (áreas, decisões AD-NNN, specs).
      - run: pnpm docs:check
